# VoltLink full stack for development/preview (builds the image locally).
# Production should use compose.production.yml with the published GHCR image.
#
#   docker compose up -d
#   # first account to register becomes the owner; demo mode is one click
#   # on the Providers page.

name: voltlink

x-voltlink-common: &voltlink
  build: .
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  networks: [internal]
  environment: &app_env
    NODE_ENV: production
    PORT: '3000'
    HOST: 0.0.0.0
    DATABASE_URL: 'postgresql://voltlink:${POSTGRES_PASSWORD:-voltlink}@postgres:5432/voltlink'
    REDIS_URL: 'redis://redis:6379'
    PUBLIC_URL: '${PUBLIC_URL:-http://localhost:3110}'
    VL_ALLOW_INSECURE_HTTP: '${VL_ALLOW_INSECURE_HTTP:-false}'
    TRUST_PROXY: '${TRUST_PROXY:-false}'
    VL_WEBAUTHN_RP_ID: '${VL_WEBAUTHN_RP_ID:-}'
    VL_CSP_CONNECT_ORIGINS: '${VL_CSP_CONNECT_ORIGINS:-}'
    STATUS_PORT: '3001'
    JWT_SECRET: '${JWT_SECRET:-}'
    JWT_EXPIRES_SEC: '${JWT_EXPIRES_SEC:-1209600}'
    VL_MASTER_KEY: '${VL_MASTER_KEY:-}'
    VL_MASTER_KEYS: '${VL_MASTER_KEYS:-}'
    VL_RATE_LIMIT_PER_MIN: '${VL_RATE_LIMIT_PER_MIN:-900}'
    VL_STEPUP_WINDOW_SEC: '${VL_STEPUP_WINDOW_SEC:-300}'
    VL_SETUP_TOKEN: '${VL_SETUP_TOKEN:-}'
    SMTP_URL: '${SMTP_URL:-}'
    MAIL_FROM: '${MAIL_FROM:-VoltLink <no-reply@voltlink.local>}'
    MAIL_TO_CONSOLE: '${MAIL_TO_CONSOLE:-true}'
    VL_TOTP_ISSUER: '${VL_TOTP_ISSUER:-VoltLink}'
    VL_WEBAUTHN_RP_NAME: '${VL_WEBAUTHN_RP_NAME:-VoltLink}'
    TESLA_CLIENT_ID: '${TESLA_CLIENT_ID:-}'
    TESLA_CLIENT_SECRET: '${TESLA_CLIENT_SECRET:-}'
    TESLA_REDIRECT_URI: '${TESLA_REDIRECT_URI:-http://localhost:3110/api/v1/providers/tesla/callback}'
    TESLA_BASE_URL: '${TESLA_BASE_URL:-https://fleet-api.prd.na.vn.cloud.tesla.com}'
    TESLA_TOKEN_URL: '${TESLA_TOKEN_URL:-https://fleet-auth.prd.vn.cloud.tesla.com/oauth2/v3/token}'
    TESLA_AUTHORIZE_URL: '${TESLA_AUTHORIZE_URL:-https://auth.tesla.com/oauth2/v3/authorize}'
    TESLA_DEFAULT_AUDIENCE: '${TESLA_DEFAULT_AUDIENCE:-https://fleet-api.prd.na.vn.cloud.tesla.com}'
    TESLA_FLEET_BASE_NA: '${TESLA_FLEET_BASE_NA:-https://fleet-api.prd.na.vn.cloud.tesla.com}'
    TESLA_FLEET_BASE_EU: '${TESLA_FLEET_BASE_EU:-https://fleet-api.prd.eu.vn.cloud.tesla.com}'
    TESLA_PARTNER_DOMAIN: '${TESLA_PARTNER_DOMAIN:-}'
    TESLA_PUBLIC_KEY_FILE: '${TESLA_PUBLIC_KEY_FILE:-/run/voltlink/tesla/public-key.pem}'
    TESLA_COMMAND_PROXY_URL: '${TESLA_COMMAND_PROXY_URL:-}'
    TESLA_ALLOW_TEST_ENDPOINTS: '${TESLA_ALLOW_TEST_ENDPOINTS:-false}'
    TESLA_DAILY_BUDGET_USD: '${TESLA_DAILY_BUDGET_USD:-}'
    TESSIE_BASE_URL: '${TESSIE_BASE_URL:-https://api.tessie.com}'
    VAPID_PUBLIC_KEY: '${VAPID_PUBLIC_KEY:-}'
    VAPID_PRIVATE_KEY: '${VAPID_PRIVATE_KEY:-}'
    VAPID_SUBJECT: '${VAPID_SUBJECT:-}'
    VL_DEMO_DEFAULT_ENABLED: '${VL_DEMO_DEFAULT_ENABLED:-false}'
    VL_OUTBOUND_ALLOW: '${VL_OUTBOUND_ALLOW:-}'
    VL_PUSH_SERVICE_HOSTS: '${VL_PUSH_SERVICE_HOSTS:-}'
    VL_DEV_ECHO_TOKENS: 'false'
    LOG_LEVEL: '${LOG_LEVEL:-info}'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voltlink
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:-voltlink}'
      POSTGRES_DB: voltlink
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voltlink -d voltlink']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *voltlink
    environment:
      <<: *app_env
      VL_ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  web:
    <<: *voltlink
    environment:
      <<: *app_env
      VL_ROLE: web
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${WEB_PORT:-3110}:3000'

  worker:
    <<: *voltlink
    environment:
      <<: *app_env
      VL_ROLE: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *voltlink
    environment:
      <<: *app_env
      VL_ROLE: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

networks:
  internal:

volumes:
  pgdata:
