# docker-compose.dev.yml — development overlay (spec L1701). Every service it
# touches is BUILT LOCALLY (use with docker-compose.build.yml), and there is
# NO live reload: after `npm run build` the freshly built web bundle is mounted
# read-only where the image reads it. It must never be part of an install path.
# Use it only as this chain, on top of the entry point:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml \
#     -f docker-compose.dev.yml up web
#
# It publishes no ports of its own: web's mapping comes from the canonical
# file, and a duplicate mapping here would conflict when VOLTLINK_BIND_ADDRESS
# is not 127.0.0.1.
services:
  web:
    environment:
      NODE_ENV: development
      DEBUG: 'voltlink:*'
    volumes:
      # R2-54: the image runs from /app/apps/api — mount where the image reads.
      - ./apps/api/dist:/app/apps/api/dist:ro
      - ./apps/api/web-dist:/app/apps/api/web-dist:ro
