# Building from source is an OVERLAY, never the install path. The install
# guide pulls the published image; this file swaps in a local build for
# contributors:
#
#   docker compose -f compose.production.yml -f docker-compose.build.yml up -d --build
#
# The built image is tagged voltlink:local and pull_policy: build keeps
# `up --build` from ever pulling the published image for these roles.
services:
  migrate:
    build: .
    image: voltlink:local
    pull_policy: build
  web:
    build: .
    image: voltlink:local
    pull_policy: build
  worker:
    build: .
    image: voltlink:local
    pull_policy: build
  scheduler:
    build: .
    image: voltlink:local
    pull_policy: build
  status:
    build: .
    image: voltlink:local
    pull_policy: build
