# VoltLink production stack — THE canonical Docker Compose install file.
# It only PULLS the published GHCR image and never builds (guide 08 §14,
# I-CINOIMAGE, I-V100). The single install guide is docs/DOCKER_COMPOSE.md:
# download this file from the release tag's URL so file and image always match.
#
#   curl -fsSL https://raw.githubusercontent.com/Atvriders/voltlink/v1.1.1/compose.production.yml -o compose.production.yml
#   docker compose -f compose.production.yml up -d --wait
#
# Required values (set them in .env next to this file; compose fails fast with
# a message if one is missing): POSTGRES_PASSWORD, JWT_SECRET, VL_MASTER_KEY,
# PUBLIC_URL. VL_MASTER_KEY is exactly 32 random bytes in standard base64:
#   umask 077; printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env
#   printf 'VL_MASTER_KEY=%s\n' "$(openssl rand -base64 32)" >> .env

name: voltlink

x-voltlink-common: &voltlink
  # VOLTLINK_IMAGE_DIGEST pins the exact digest (I-V100): the reference
  # becomes repo:tag@sha256:<digest> and verify-published boots by digest.
  # The default tag is the release this file ships with (v + package.json).
  image: ghcr.io/atvriders/voltlink:${VOLTLINK_IMAGE_TAG:-v1.1.1}${VOLTLINK_IMAGE_DIGEST:-}
  restart: unless-stopped
  pull_policy: always
  init: true
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  environment: &app_env
    NODE_ENV: production
    PORT: '3000'
    HOST: 0.0.0.0
    DATABASE_URL: 'postgresql://voltlink:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/voltlink'
    REDIS_URL: 'redis://redis:6379'
    PUBLIC_URL: '${PUBLIC_URL:?set PUBLIC_URL in .env}'
    VL_ALLOW_INSECURE_HTTP: '${VL_ALLOW_INSECURE_HTTP:-false}'
    TRUST_PROXY: '${TRUST_PROXY:-false}'
    VL_WEBAUTHN_RP_ID: '${VL_WEBAUTHN_RP_ID:-}'
    VL_CSP_CONNECT_ORIGINS: '${VL_CSP_CONNECT_ORIGINS:-}'
    STATUS_PORT: '3001'
    JWT_SECRET: '${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}'
    JWT_EXPIRES_SEC: '${JWT_EXPIRES_SEC:-1209600}'
    VL_MASTER_KEY: '${VL_MASTER_KEY:?set VL_MASTER_KEY in .env (openssl rand -base64 32)}'
    VL_MASTER_KEYS: '${VL_MASTER_KEYS:-}'
    # R2-67: default is the product default; empty is treated as unset at boot.
    VL_MASTER_KEY_VERSION: '${VL_MASTER_KEY_VERSION:-1}'
    VL_QUEUE_PREFIX: '${VL_QUEUE_PREFIX:-voltlink}'
    VL_TEST_FROZEN_NOW: '${VL_TEST_FROZEN_NOW:-}'
    VL_POLLER_ENABLED: '${VL_POLLER_ENABLED:-true}'
    TESSIE_API_KEY: '${TESSIE_API_KEY:-}'
    VL_RATE_LIMIT_PER_MIN: '${VL_RATE_LIMIT_PER_MIN:-900}'
    VL_STEPUP_WINDOW_SEC: '${VL_STEPUP_WINDOW_SEC:-300}'
    VL_SETUP_TOKEN: '${VL_SETUP_TOKEN:-}'
    SMTP_URL: '${SMTP_URL:-}'
    MAIL_FROM: '${MAIL_FROM:-VoltLink <no-reply@voltlink.local>}'
    MAIL_TO_CONSOLE: '${MAIL_TO_CONSOLE:-false}'
    VL_TOTP_ISSUER: '${VL_TOTP_ISSUER:-VoltLink}'
    VL_WEBAUTHN_RP_NAME: '${VL_WEBAUTHN_RP_NAME:-VoltLink}'
    TESLA_CLIENT_ID: '${TESLA_CLIENT_ID:-}'
    TESLA_CLIENT_SECRET: '${TESLA_CLIENT_SECRET:-}'
    TESLA_REDIRECT_URI: '${TESLA_REDIRECT_URI:-}'
    TESLA_BASE_URL: '${TESLA_BASE_URL:-https://fleet-api.prd.na.vn.cloud.tesla.com}'
    TESLA_TOKEN_URL: '${TESLA_TOKEN_URL:-https://fleet-auth.prd.vn.cloud.tesla.com/oauth2/v3/token}'
    TESLA_AUTHORIZE_URL: '${TESLA_AUTHORIZE_URL:-https://auth.tesla.com/oauth2/v3/authorize}'
    TESLA_DEFAULT_AUDIENCE: '${TESLA_DEFAULT_AUDIENCE:-https://fleet-api.prd.na.vn.cloud.tesla.com}'
    TESLA_FLEET_BASE_NA: '${TESLA_FLEET_BASE_NA:-https://fleet-api.prd.na.vn.cloud.tesla.com}'
    TESLA_FLEET_BASE_EU: '${TESLA_FLEET_BASE_EU:-https://fleet-api.prd.eu.vn.cloud.tesla.com}'
    TESLA_PARTNER_DOMAIN: '${TESLA_PARTNER_DOMAIN:-}'
    TESLA_PUBLIC_KEY_FILE: '${TESLA_PUBLIC_KEY_FILE:-/run/voltlink/tesla/public-key.pem}'
    TESLA_COMMAND_PROXY_URL: '${TESLA_COMMAND_PROXY_URL:-}'
    TESLA_ALLOW_TEST_ENDPOINTS: '${TESLA_ALLOW_TEST_ENDPOINTS:-false}'
    TESLA_DAILY_BUDGET_USD: '${TESLA_DAILY_BUDGET_USD:-}'
    # Tesla proxy CA: copy the proxy CA into the app roles (see TESLA_SETUP.md
    # and docker-compose.ci.yml's tesla-profile mounts for the exact shape).
    NODE_EXTRA_CA_CERTS: '${NODE_EXTRA_CA_CERTS:-}'
    VL_GEOCODER: '${VL_GEOCODER:-off}'
    VL_GEOCODER_URL: '${VL_GEOCODER_URL:-}'
    VL_MAP_MODE: '${VL_MAP_MODE:-demo}'
    VL_MAP_STYLE_URL: '${VL_MAP_STYLE_URL:-}'
    VL_MAP_PMTILES_URL: '${VL_MAP_PMTILES_URL:-}'
    VL_MAP_ASSETS_URL: '${VL_MAP_ASSETS_URL:-}'
    VL_MAP_ATTRIBUTION: '${VL_MAP_ATTRIBUTION:-}'
    VL_MAP_TILES_DIR: '${VL_MAP_TILES_DIR:-}'
    TESSIE_BASE_URL: '${TESSIE_BASE_URL:-https://api.tessie.com}'
    VAPID_PUBLIC_KEY: '${VAPID_PUBLIC_KEY:-}'
    VAPID_PRIVATE_KEY: '${VAPID_PRIVATE_KEY:-}'
    VAPID_SUBJECT: '${VAPID_SUBJECT:-}'
    VL_DEMO_DEFAULT_ENABLED: '${VL_DEMO_DEFAULT_ENABLED:-false}'
    VL_OUTBOUND_ALLOW: '${VL_OUTBOUND_ALLOW:-}'
    VL_PUSH_SERVICE_HOSTS: '${VL_PUSH_SERVICE_HOSTS:-}'
    VL_DEV_ECHO_TOKENS: 'false'
    LOG_LEVEL: '${LOG_LEVEL:-info}'

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: voltlink
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}'
      POSTGRES_DB: voltlink
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voltlink -d voltlink']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    <<: *voltlink
    environment:
      <<: *app_env
      VL_ROLE: migrate
    networks: [internal]
    healthcheck:
      test: ['CMD', '/usr/local/bin/voltlink-healthcheck']
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  web:
    <<: *voltlink
    environment:
      <<: *app_env
      VL_ROLE: web
    networks: [internal, egress]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '${VOLTLINK_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3110}:3000'
    healthcheck:
      test: ['CMD', '/usr/local/bin/voltlink-healthcheck']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  worker:
    <<: *voltlink
    environment:
      <<: *app_env
      VL_ROLE: worker
    networks: [internal, egress]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', '/usr/local/bin/voltlink-healthcheck']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  scheduler:
    <<: *voltlink
    environment:
      <<: *app_env
      VL_ROLE: scheduler
    networks: [internal, egress]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', '/usr/local/bin/voltlink-healthcheck']
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Optional: an independent public status role on a separate port.
  status:
    <<: *voltlink
    profiles: ['status']
    environment:
      <<: *app_env
      VL_ROLE: status
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '${VOLTLINK_BIND_ADDRESS:-127.0.0.1}:${STATUS_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD', '/usr/local/bin/voltlink-healthcheck']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  tesla-proxy:
    image: tesla/vehicle-command:0.4.1
    profiles: ['tesla']
    restart: unless-stopped
    environment:
      TESLA_HTTP_PROXY_TLS_CERT: /config/tls-cert.pem
      TESLA_HTTP_PROXY_TLS_KEY: /config/tls-key.pem
      TESLA_HTTP_PROXY_HOST: 0.0.0.0
      TESLA_HTTP_PROXY_PORT: '4443'
      TESLA_HTTP_PROXY_TIMEOUT: 20s
      TESLA_KEY_FILE: /keys/fleet-key.pem
    volumes:
      - ./tesla/proxy-tls:/config:ro
      - ./tesla/keys/fleet-key.pem:/keys/fleet-key.pem:ro
    security_opt: ['no-new-privileges:true']
    read_only: true
    networks: [egress]

networks:
  # Backend network: only postgres, redis and the app roles. No route out.
  internal:
    internal: true
  # Egress network: app roles that reach the internet (providers, push, maps)
  # and the Tesla proxy share this network (R2-03, NEW-17).
  egress:

volumes:
  pgdata:
