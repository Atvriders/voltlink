# Gitleaks configuration. Test fixtures and CI placeholders use
# fictional secrets on purpose; real secrets must never be committed.
# R2-26: keep the full default ruleset and allowlist only exact fixture
# strings — never a pattern that could hide real keys, never whole paths.

[extend]
  useDefault = true

[allowlist]
  description = 'Exact fictional fixture strings only'
  regexes = [
    'test-jwt-secret',
    'integration-pass',
    '0123456789abcdef',
    'Not a secret',
    'a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4',
    '1f426ba798b13473ada9f62fc373b4c4',
    'MWY0MjZiYTc5OGIxMzQ3M2FkYTlmNjJmYzM3M2I0',
    'da1ed84cbe380e8b2639006b5bdfcdce0ebc4775',
    '9f3b7c1d5e8a24609bd4f7a1c3e5079b2d6481fa',
    '4c1f8e05a9d73b62f0ae14d78c3b95206ea7d41f',
    'ci-e2e-master-key-not-produc',
    'Y2ktZTJlLW1hc3Rlci1rZXktbm90LXByb2R1Y3Rp',
    # Fictional fixture master key ('not-a-real-master-key-0123456789') used
    # by ci/compose.env and the NEW-10 boot test.
    'bm90LWEtcmVhbC1tYXN0ZXIta2V5LTAxMjM0NTY3ODk=',
    '6d1c05e7f38b49a2ce7014b8d5f3a96201e8b7c4d90f523a6e18cb47f0d29a35',
    # CI boot fixture used by the e2e/image jobs (replaces the old value that
    # the placeholder refusal rejected because it contained the word 'secret').
    'd31f4c8a9b2e7f06c5a1d8e3f09b4c7d2e6a5f1c8b3d0e9a7f4c2b6d1e8f5a3c0b9d',
    # Published local-trial defaults inside compose.production.yml (the
    # no-.env install flow; the guide tells users to rotate them).
    '0273562be8b07bd887cce80c59cc66e4',
    'c4ed0b963a2d89dad3387e59110914f76b9b48dc02864964559a4eb37a277049',
    '7lJee8kLzmhXwiZ4unoDcNovLtdFe0kupkb3xXqTiRg=',
  ]
