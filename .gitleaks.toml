# Gitleaks configuration. Test fixtures and CI placeholders use
# fictional secrets on purpose; real secrets must never be committed.
# R2-26: only exact fixture strings are allowlisted — never a pattern that
# could hide real API keys, and never whole directory paths.

[allowlist]
  description = 'Exact fictional fixture strings only'
  regexes = [
    'test-jwt-secret',
    'integration-pass',
    '0123456789abcdef',
    'Not a secret',
  ]
