# VoltLink behind a Cloudflare Tunnel whose connector runs SOMEWHERE ELSE
# (another host, another stack). No connector is added here and no tunnel
# token is needed: this file only makes the app correct behind the tunnel.
#
#   docker compose -f docker-compose.yml -f docker-compose.tunnel.yml up -d --wait
#
# Values this overlay expects from the environment (a `.env` next to these
# files, or the shell):
#
#   PUBLIC_URL=https://voltlink.example.com   the tunnel's public hostname
#   VOLTLINK_BIND_ADDRESS=192.168.1.67        the address the connector reaches
#
# PUBLIC_URL is REQUIRED here (fail-fast) because it cannot be guessed: it is
# what the app uses for absolute links, cookies and WebAuthn. A wrong or
# missing value is the difference between a working tunnel and a login loop.
#
# VOLTLINK_BIND_ADDRESS must be an address the remote connector can reach —
# the default 127.0.0.1 is only visible on this host. It has to be set in the
# environment, not here: port publishing is interpolated once, before any
# overlay is merged, and Compose CONCATENATES `ports` across files (an overlay
# that lists the mapping again would publish 3110 twice and fail to start).
# Prefer the host's LAN address over 0.0.0.0, and firewall the port to the
# connector's address.
#
# What this overlay does change:
#
#   - TRUST_PROXY=1 — exactly one hop (the connector) sets
#     X-Forwarded-For/Proto. Without it the app never sees the request as
#     https and the session cookie is rejected. It must be a hop count: the
#     bare boolean value is refused at boot, since it would let any client
#     choose its own address (apps/api/src/core/env.ts, parseTrustProxy).
#     Override with a list of connector addresses/CIDRs if you prefer.
#
# `VL_ALLOW_INSECURE_HTTP` is NOT needed: the tunnel's public URL is https, so
# the production https requirement is already satisfied. The connector reaches
# the origin over plain HTTP on the private hop, which is expected.
#
# On the Cloudflare side, the tunnel's public hostname service is the origin
# you run here, e.g. http://192.168.1.67:3110.

x-tunnel-env: &tunnel-env
  PUBLIC_URL: '${PUBLIC_URL:?set PUBLIC_URL to the tunnel hostname, for example https://voltlink.example.com}'
  TRUST_PROXY: '${TRUST_PROXY:-1}'

services:
  web:
    environment:
      <<: *tunnel-env

  worker:
    environment:
      <<: *tunnel-env

  scheduler:
    environment:
      <<: *tunnel-env

  status:
    environment:
      <<: *tunnel-env
