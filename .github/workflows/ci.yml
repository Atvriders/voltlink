# VoltLink CI (guide 04 §7.1 + guide 08 §14). Every action is pinned by commit
# SHA. Publish only after every job passes; versions are never re-pointed.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Not a secret: CI needs valid boot keys; never used by any deployment.
  JWT_SECRET: da1ed84cbe380e8b2639006b5bdfcdce0ebc47754ca248e1277b16a8f8be4093
  VL_MASTER_KEY: MWY0MjZiYTc5OGIxMzQ3M2FkYTlmNjJmYzM3M2I0YzQ=
  DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/voltlink
  REDIS_URL: redis://127.0.0.1:6379
  TEST_DATABASE_ADMIN_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/postgres
  VL_SETUP_TOKEN: ci-setup-token-0123456789abcdef0123456789abcdef

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voltlink
          POSTGRES_PASSWORD: voltlink
          POSTGRES_DB: voltlink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voltlink -d voltlink"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Shared package build (api/web typecheck imports @voltlink/shared)
        run: npm -w @voltlink/shared run build
      - name: Prisma client (typecheck needs the generated client, not the stub)
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Format gate (prettier)
        run: npx prettier --check .
      - name: Lint (zero warnings)
        run: npx eslint . --max-warnings=0
      - name: Typecheck including tests, e2e and scripts (C-TYPECHECK)
        run: npm run typecheck
      - name: Compose passes every ENV_SPEC variable (I-COMPOSEENV)
        run: npm run check:compose
      - name: Compose files parse (G-01)
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f compose.production.yml config -q
      - name: Trivy ignore hygiene (I-TRIVY)
        run: npx tsx scripts/check-trivy-ignore.ts
      - name: Prisma client + migrations
        run: |
          npx prisma generate --schema apps/api/prisma/schema.prisma
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Create the shadow database (P-DBDRIFT gates)
        run: |
          apt-get update -qq && apt-get install -y -qq postgresql-client >/dev/null
          PGPASSWORD=voltlink createdb -h 127.0.0.1 -U voltlink shadow
        env:
          SHADOW_DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/shadow
      - name: 'Drift gate 1: migrations folder matches schema (P-DBDRIFT)'
        run: |
          npx prisma migrate diff --from-migrations apps/api/prisma/migrations \
            --to-schema-datamodel apps/api/prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/shadow
      - name: 'Drift gate 2: deployed database matches schema (P-DBDRIFT)'
        run: |
          npx prisma migrate diff --from-url "$DATABASE_URL" \
            --to-schema-datamodel apps/api/prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/shadow
      - name: Build (bundle + selftest entry + SPA)
        run: npm run build
      - name: Legacy scan
        run: npm run legacy:scan
      - name: Naming scan
        run: npm run naming:scan
      - name: GLB / manifest validation (guide 06)
        run: npx tsx scripts/assets/validate.mts
      - name: Dependency audit
        run: npm audit --audit-level=high

  unit-int:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voltlink
          POSTGRES_PASSWORD: voltlink
          POSTGRES_DB: voltlink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voltlink -d voltlink"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm -w @voltlink/shared run build
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Full vitest suite with JSON report
        run: npx vitest run --maxWorkers=4 --reporter=default --reporter=json --outputFile.json=test-results/vitest.json
      - name: Test inventory (every required category non-zero)
        run: npx tsx scripts/test-inventory.ts

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voltlink
          POSTGRES_PASSWORD: voltlink
          POSTGRES_DB: voltlink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voltlink -d voltlink"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm -w @voltlink/shared run build
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Migration tests (throwaway databases)
        run: npx vitest run test/migration.test.ts test/migrations.test.ts
        working-directory: apps/api

  e2e-fullstack:
    runs-on: ubuntu-latest
    needs: [checks]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voltlink
          POSTGRES_PASSWORD: voltlink
          POSTGRES_DB: voltlink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voltlink -d voltlink"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: bash scripts/e2e/start-stack.sh
      # smoke.mjs assumes first-run setup; start-stack.sh already bootstraps the
      # instance admin (registration is open), so the smoke belongs to the image
      # job's fresh compose stack. The Playwright matrix covers register/demo/
      # command/SSE with stronger assertions here.
      - name: Playwright matrix (desktop/tablet/mobile/webgl/a11y/visual/legacy)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:3111
      - name: Tesla e2e against the fake Fleet API
        run: bash scripts/e2e/tesla-e2e.sh
      - name: API log
        if: always()
        run: tail -60 /tmp/voltlink-api.log

  image:
    runs-on: ubuntu-latest
    needs: [checks, unit-int, migrations, e2e-fullstack]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build image (in-image selftest runs as a build step)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: voltlink:ci
      - name: Scan image (HIGH/CRITICAL fail, Trivy ignores honoured)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: voltlink:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
      - name: Boot stack from the image and smoke it
        run: |
          POSTGRES_PASSWORD=voltlink JWT_SECRET="$JWT_SECRET" VL_MASTER_KEY="$VL_MASTER_KEY" \
            PUBLIC_URL=http://127.0.0.1:3110 VL_ALLOW_INSECURE_HTTP=true VL_SETUP_TOKEN="$VL_SETUP_TOKEN" \
            docker compose -f compose.production.yml -f docker-compose.ci.yml up -d --wait
          node scripts/smoke.mjs
          docker compose -f compose.production.yml restart worker
          node scripts/smoke.mjs
          docker compose -f compose.production.yml down -v

  compose-dev-smoke:
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Dev compose parses and interpolates
        run: docker compose -f docker-compose.yml config -q
      - name: ENV_SPEC contract
        run: npm run check:compose

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Gitleaks over the full history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: [image, secret-scan, compose-dev-smoke]
    if: github.event_name == 'push' && github.server_url == 'https://github.com'
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # The full commit-SHA tag only: latest/vX.Y.Z are pointed at it by
          # promote AFTER verify-published boots the digest (I-V100).
          tags: |
            type=sha,format=long
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true

  verify-published:
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Boot the published digest and smoke it
        env:
          VOLTLINK_IMAGE_TAG: sha256:${{ needs.publish.outputs.digest }}
        run: |
          POSTGRES_PASSWORD=voltlink JWT_SECRET="$JWT_SECRET" VL_MASTER_KEY="$VL_MASTER_KEY" \
            PUBLIC_URL=http://127.0.0.1:3110 VL_ALLOW_INSECURE_HTTP=true VL_SETUP_TOKEN="$VL_SETUP_TOKEN" \
            docker compose -f compose.production.yml up -d --wait
          node scripts/smoke.mjs
          docker compose -f compose.production.yml down -v

  promote:
    runs-on: ubuntu-latest
    needs: [publish, verify-published]
    if: github.event_name == 'push' && github.server_url == 'https://github.com'
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Versions are never re-pointed: latest only from main, vX.Y.Z only from a
      # pushed git tag (I-V100). The tag simply re-labels the verified digest.
      - name: Point latest at the verified digest (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            "ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}"
      - name: Point the version tag at the verified digest (git tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}" \
            "ghcr.io/${{ github.repository }}@${{ needs.publish.outputs.digest }}"
