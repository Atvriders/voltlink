# VoltLink CI (guide 04 §7.1 + guide 08 §14). Every action is pinned by commit
# SHA. Publish only after every job passes; versions are never re-pointed.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Prisma schema validation (generate) and the drift gates need a
    # DATABASE_URL even though checks never boots the app; the service below
    # is the real throwaway database. Not a secret.
    env:
      DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/voltlink
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voltlink
          POSTGRES_PASSWORD: voltlink
          POSTGRES_DB: voltlink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voltlink -d voltlink"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Shared package build (api/web typecheck imports @voltlink/shared)
        run: npm -w @voltlink/shared run build
      - name: Prisma client (typecheck needs the generated client, not the stub)
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Format gate (prettier)
        run: npx prettier --check .
      - name: Lint (zero warnings)
        run: npx eslint . --max-warnings=0
      - name: Typecheck including tests, e2e and scripts (C-TYPECHECK)
        run: npm run typecheck
      - name: Compose passes every ENV_SPEC variable (I-COMPOSEENV)
        run: npm run check:compose
      - name: Compose files parse (G-01)
        run: |
          # No .env file is needed: every required value has a default inside
          # the compose file, so config-only calls run against an empty env.
          : > /tmp/empty.env
          docker compose -f docker-compose.yml --env-file /tmp/empty.env config -q
          docker compose -f compose.production.yml --env-file /tmp/empty.env config -q
      - name: Trivy ignore hygiene (I-TRIVY)
        run: npx tsx scripts/check-trivy-ignore.ts
      - name: Prisma client + migrations
        run: |
          npx prisma generate --schema apps/api/prisma/schema.prisma
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Create the shadow database (P-DBDRIFT gates)
        run: |
          apt-get update -qq && apt-get install -y -qq postgresql-client >/dev/null
          PGPASSWORD=voltlink createdb -h 127.0.0.1 -U voltlink shadow
        env:
          SHADOW_DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/shadow
      - name: 'Drift gate 1: migrations folder matches schema (P-DBDRIFT)'
        run: |
          npx prisma migrate diff --from-migrations apps/api/prisma/migrations \
            --to-schema-datamodel apps/api/prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/shadow
      - name: 'Drift gate 2: deployed database matches schema (P-DBDRIFT)'
        run: |
          npx prisma migrate diff --from-url "$DATABASE_URL" \
            --to-schema-datamodel apps/api/prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
        env:
          SHADOW_DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/shadow
      - name: Build (bundle + selftest entry + SPA)
        run: npm run build
      - name: Bundle guard (no three/map/charts preloads)
        run: npm run check:bundle
      - name: Legacy scan
        run: npm run legacy:scan
      - name: Naming scan
        run: npm run naming:scan
      - name: Stack-safety gate (R2-24)
        run: npm run check:stack-safety
      - name: GLB / manifest validation (guide 06)
        run: npx tsx scripts/assets/validate.mts
      - name: Dependency audit
        run: npm audit --audit-level=high

  unit-int:
    runs-on: ubuntu-latest
    # C5.1: the boot environment is scoped to the jobs that boot the app —
    # no compose step inherits it (workflow-level env is gone).
    env:
      DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/voltlink
      TEST_DATABASE_ADMIN_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voltlink
          POSTGRES_PASSWORD: voltlink
          POSTGRES_DB: voltlink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voltlink -d voltlink"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm -w @voltlink/shared run build
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Full vitest suite with JSON report (coverage thresholds enforced)
        run: npx vitest run --maxWorkers=4 --coverage --reporter=default --reporter=json --outputFile.json=test-results/vitest.json
      - name: Test inventory (every required category non-zero)
        run: npx tsx scripts/test-inventory.ts

  migrations:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/voltlink
      TEST_DATABASE_ADMIN_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/postgres
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voltlink
          POSTGRES_PASSWORD: voltlink
          POSTGRES_DB: voltlink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voltlink -d voltlink"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm -w @voltlink/shared run build
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Migration tests (throwaway databases)
        env:
          CHECKPOINT_DISABLE: '1'
        # The root config's api-int project declares the tags these files
        # carry; apps/api/vitest.config.ts does not (it broke the migrations
        # job in the v1.1.0 run), and vitest would also pick that config up
        # from a apps/api working directory. Tags are kept.
        run: npx vitest run --project api-int apps/api/test/migration.test.ts apps/api/test/migrations.test.ts

  backup-restore:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/voltlink
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voltlink
          POSTGRES_PASSWORD: voltlink
          POSTGRES_DB: voltlink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voltlink -d voltlink"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm -w @voltlink/shared run build
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Install postgres client tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - name: Back up the migrated database with the real script
        env:
          PGPASSWORD: voltlink
        run: |
          npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
          bash scripts/ci/backup-restore.sh backup /tmp/voltlink.dump
      - name: Restore into a fresh database and compare counts
        env:
          PGPASSWORD: voltlink
        run: |
          createdb -h 127.0.0.1 -U voltlink voltlink_restore
          PGDATABASE=voltlink_restore bash scripts/ci/backup-restore.sh restore /tmp/voltlink.dump
          A="$(psql -h 127.0.0.1 -U voltlink -d voltlink -tA -c 'SELECT count(*) FROM "User"')"
          B="$(psql -h 127.0.0.1 -U voltlink -d voltlink_restore -tA -c 'SELECT count(*) FROM "User"')"
          test "$A" = "$B" || { echo "user rows differ: $A vs $B"; exit 1; }
          echo "backup/restore verified: $A users in both"

  e2e-fullstack:
    runs-on: ubuntu-latest
    needs: [checks]
    env:
      DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/voltlink
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: d31f4c8a9b2e7f06c5a1d8e3f09b4c7d2e6a5f1c8b3d0e9a7f4c2b6d1e8f5a3c0b9d
      VL_MASTER_KEY: uL2hWy3aGmYKcQI4soDsYMdM2fABx/kO251Dx5uKAps=
      PUBLIC_URL: http://127.0.0.1:3111
      VL_ALLOW_INSECURE_HTTP: 'true'
      VL_SETUP_TOKEN: ci-e2e-setup-token-0123456789abcdef
      VL_QUEUE_PREFIX: voltlink-ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: voltlink
          POSTGRES_PASSWORD: voltlink
          POSTGRES_DB: voltlink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voltlink -d voltlink"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Guide 08 §11.2: the whole e2e matrix runs against the scripted
      # frozen visual stack (fresh voltlink_visual database, NODE_ENV=test,
      # VL_TEST_FROZEN_NOW, poller off) — no hand-set environment anywhere.
      - run: bash scripts/e2e/start-stack.sh visual
        env:
          # start-stack.sh never reads apps/api/.env (R2-24); everything comes
          # from the environment. Public URL is the API itself, which serves
          # the built SPA. Plain HTTP is fine on the ephemeral CI network.
          # A stable RUN_DIR keeps the stack logs at a known path for the
          # failure-artifact and log-tail steps below.
          RUN_DIR: ${{ runner.temp }}/stack-run
          DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/voltlink
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: d31f4c8a9b2e7f06c5a1d8e3f09b4c7d2e6a5f1c8b3d0e9a7f4c2b6d1e8f5a3c0b9d
          VL_MASTER_KEY: uL2hWy3aGmYKcQI4soDsYMdM2fABx/kO251Dx5uKAps=
          PUBLIC_URL: http://127.0.0.1:3111
          VL_ALLOW_INSECURE_HTTP: 'true'
          VL_SETUP_TOKEN: ci-e2e-setup-token-0123456789abcdef
          VL_QUEUE_PREFIX: voltlink-ci
      # smoke.mjs assumes first-run setup; start-stack.sh already bootstraps the
      # instance admin (registration is open), so the smoke belongs to the image
      # job's fresh compose stack. The Playwright matrix covers register/demo/
      # command/SSE with stronger assertions here.
      - name: Playwright matrix (desktop/tablet/mobile/webgl/a11y/visual)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test \
            --project=desktop --project=tablet --project=mobile \
            --project=webgl-swiftshader --project=no-webgl --project=a11y \
            --project=visual-no-webgl --project=visual-reduced-motion \
            --update-snapshots=none --workers=3
        env:
          E2E_BASE_URL: http://127.0.0.1:3111
          VL_E2E_SMTP_HTTP: http://127.0.0.1:1026
      - name: Test inventory (no e2e skips, no e2e failures)
        run: npx tsx scripts/test-inventory.ts
      - name: Fresh-install browser test (docs path, no API or SQL shortcuts)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          createdb -h 127.0.0.1 -U voltlink voltlink_fresh
          DATABASE_URL=postgresql://voltlink:voltlink@127.0.0.1:5432/voltlink_fresh \
            REDIS_URL=redis://127.0.0.1:6379 \
            JWT_SECRET=d31f4c8a9b2e7f06c5a1d8e3f09b4c7d2e6a5f1c8b3d0e9a7f4c2b6d1e8f5a3c0b9d \
            VL_MASTER_KEY=uL2hWy3aGmYKcQI4soDsYMdM2fABx/kO251Dx5uKAps= \
            PUBLIC_URL=http://127.0.0.1:3112 VL_ALLOW_INSECURE_HTTP=true \
            VL_QUEUE_PREFIX=voltlink-fresh PORT=3112 RUN_DIR="$PWD/scripts/e2e/run-fresh" \
            VL_FRESH_SETUP=1 VL_SETUP_TOKEN='' bash scripts/e2e/start-stack.sh
          . scripts/e2e/run-fresh/fresh-setup.env
          npx playwright install --with-deps chromium
          npx playwright test tests/e2e/fresh-install.spec.ts --project=fresh-install
          RUN_DIR="$PWD/scripts/e2e/run-fresh" bash scripts/e2e/start-stack.sh stop
        env:
          E2E_BASE_URL: http://127.0.0.1:3112
      - name: Tesla e2e against the fake Fleet API
        run: bash scripts/e2e/tesla-e2e.sh
        env:
          E2E_BASE_URL: http://127.0.0.1:3111
          VL_E2E_SMTP_HTTP: http://127.0.0.1:1026
          E2E_USER_EMAIL: tesla-e2e-user@voltlink.test
          E2E_USER_PASSWORD: e2e-password-123
          DATABASE_URL: postgresql://voltlink:voltlink@127.0.0.1:5432/voltlink
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: d31f4c8a9b2e7f06c5a1d8e3f09b4c7d2e6a5f1c8b3d0e9a7f4c2b6d1e8f5a3c0b9d
          VL_MASTER_KEY: uL2hWy3aGmYKcQI4soDsYMdM2fABx/kO251Dx5uKAps=
          PUBLIC_URL: http://127.0.0.1:3111
          VL_ALLOW_INSECURE_HTTP: 'true'
          VL_SETUP_TOKEN: ci-e2e-setup-token-0123456789abcdef
          VL_QUEUE_PREFIX: voltlink-ci
      - name: Stack logs (api/worker/scheduler/smtp)
        if: always()
        run: |
          for f in api worker scheduler smtp; do
            echo "===== $f.log ====="
            tail -60 "$RUNNER_TEMP/stack-run/logs/$f.log" || true
          done
      - name: Upload e2e evidence (traces, screenshots, stack logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/pw/**
            test-results/playwright.json
            tests/e2e/**/*-snapshots/**
            ${{ runner.temp }}/stack-run/logs/**
            scripts/e2e/run-fresh/logs/**
          if-no-files-found: ignore
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    needs: [checks, unit-int, migrations, e2e-fullstack]
    # Tag runs build nothing (C5.8).
    if: github.ref_type != 'tag'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build image (in-image selftest runs as a build step)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: voltlink:ci
      - name: Scan image (HIGH/CRITICAL fail, Trivy ignores honoured)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: voltlink:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          trivyignores: .trivyignore.yaml
      - name: Guide runner — get files, create .env, start (docs word for word)
        env:
          SMOKE_EMAIL: smoke@example.invalid
          SMOKE_PASSWORD: smoke-password-12345
        run: |
          # Substitutions (printed by the runner): the compose files and the
          # .env.example come from the checkout, and the CI overlay travels as
          # a COMPOSE_FILE exported for every block so the run boots the CI
          # image swap instead of pulling from GHCR (the guide stays bare
          # `docker compose` and needs no env file). The runner executes every
          # block under env -i (PATH, HOME, DOCKER_* only). NO database
          # tampering: a fresh volume is already a first-run instance (R2-27).
          node scripts/install-doc-run.mjs --workdir compose-smoke \
            --compose-src "$PWD/compose.production.yml" --env-example-src "$PWD/.env.example" \
            --ci-overlay docker-compose.ci.yml \
            --skip env-lan,env-https,env-webauthn --until up
      - name: Fresh-install web UI spec against the compose stack (TI-12, first-run)
        env:
          FRESH_E2E_EMAIL: smoke@example.invalid
          FRESH_E2E_PASSWORD: smoke-password-12345
        run: |
          cd compose-smoke
          FRESH_SETUP_TOKEN=$(docker compose logs web 2>&1 | grep 'first-run setup token' | tail -1 | awk '{print $NF}')
          test -n "$FRESH_SETUP_TOKEN" || { echo 'no first-run token in web log'; exit 1; }
          cd ..
          npx playwright install --with-deps chromium
          FRESH_SETUP_TOKEN="$FRESH_SETUP_TOKEN" E2E_BASE_URL=http://127.0.0.1:3110 \
            npx playwright test tests/e2e/fresh-install.spec.ts --project=fresh-install
      - name: Smoke — sign in, demo, a command to a terminal state (TI-19/R2-27)
        env:
          SMOKE_EMAIL: smoke@example.invalid
          SMOKE_PASSWORD: smoke-password-12345
        run: |
          cd compose-smoke
          # Bare `docker compose` — COMPOSE_FILE lives in .env (C6). The admin
          # exists from the UI spec above, so this is the login-reuse mode.
          SMOKE_EMAIL="$SMOKE_EMAIL" SMOKE_PASSWORD="$SMOKE_PASSWORD" node ../scripts/smoke.mjs
          # restart smoke: the same account signs in again and the command
          # reaches a terminal state.
          docker compose restart worker
          SMOKE_EMAIL="$SMOKE_EMAIL" SMOKE_PASSWORD="$SMOKE_PASSWORD" node ../scripts/smoke.mjs
      - name: Status profile (guide block) serves healthz on its port
        run: |
          cd compose-smoke
          docker compose --profile status up -d --wait
          curl -fsS http://127.0.0.1:3001/healthz
      - name: Tesla profile — throwaway TLS + proxy reachable from web/worker (R2-03)
        run: |
          cd compose-smoke
          mkdir -p tesla/proxy-tls tesla/keys
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout tesla/proxy-tls/tls-key.pem -out tesla/proxy-tls/tls-cert.pem \
            -subj '/CN=tesla-proxy' -addext 'subjectAltName=DNS:tesla-proxy'
          openssl ecparam -name prime256v1 -genkey -noout -out tesla/keys/fleet-key.pem
          # The CI overlay stays in COMPOSE_FILE; only the tesla mounts overlay
          # is added on the command line.
          docker compose -f ../docker-compose.tesla-ci.yml --profile tesla up -d --wait
          docker compose exec -T web node -e "
            const https = require('https');
            const req = https.request({ host: 'tesla-proxy', port: 4443, path: '/', ca: require('fs').readFileSync('/run/voltlink/tesla/proxy-tls/tls-cert.pem') }, (res) => { console.log('web->tesla-proxy status', res.statusCode); process.exit(res.statusCode < 500 ? 0 : 1); });
            req.on('error', (e) => { console.error(e.message); process.exit(1); });
            req.end();
          "
          docker compose exec -T worker node -e "
            const https = require('https');
            const req = https.request({ host: 'tesla-proxy', port: 4443, path: '/', ca: require('fs').readFileSync('/run/voltlink/tesla/proxy-tls/tls-cert.pem') }, (res) => { console.log('worker->tesla-proxy status', res.statusCode); process.exit(res.statusCode < 500 ? 0 : 1); });
            req.on('error', (e) => { console.error(e.message); process.exit(1); });
            req.end();
          "
      - name: Backup, restore and down/down -v per the docs (R2-52/R2-05)
        run: |
          cd compose-smoke
          # backup per BACKUP_RESTORE.md
          docker compose exec -T postgres pg_dump -U voltlink -d voltlink -Fc > backup.dump
          # restore into a fresh database per BACKUP_RESTORE.md
          docker compose exec -T postgres psql -U voltlink -d postgres -c 'CREATE DATABASE voltlink_restore'
          docker compose exec -T postgres pg_restore -U voltlink -d voltlink_restore < backup.dump || true
          # 'down' keeps the volume; boot again and the account must still exist
          docker compose down
          docker compose up -d --wait
          curl -fsS http://127.0.0.1:3110/healthz
          docker compose down -v

  compose-validate:
    # R2-65: this job is the renamed compose-dev-smoke — the chosen fix is the
    # rename (the old job never existed in the workflow; the dev overlay is
    # validated here as the documented entry-point chain instead of a boot).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Every supported compose invocation parses and interpolates
        run: |
          set -e
          # Config-only calls use the committed fixture env so the values stay
          # deterministic; the in-file defaults are what make any of these
          # succeed with an empty environment. The dev overlays are validated
          # only as the entry-point chain documented in their headers.
          docker compose -f compose.production.yml --env-file ci/compose.env config -q
          docker compose -f compose.production.yml --env-file ci/compose.env --profile status config -q
          docker compose -f compose.production.yml --env-file ci/compose.env --profile tesla config -q
          docker compose -f docker-compose.yml --env-file ci/compose.env config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml --env-file ci/compose.env config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml -f docker-compose.dev.yml --env-file ci/compose.env config -q
          docker compose -f compose.production.yml -f docker-compose.ci.yml --env-file ci/compose.env config -q
      - name: Renderer agrees with docker compose config (C3)
        run: |
          set -e
          cp .env.example /tmp/cmp.env
          printf 'POSTGRES_PASSWORD=ci-pg\nJWT_SECRET=%s\nVL_MASTER_KEY=%s\nPUBLIC_URL=https://voltlink.example.com\n' \
            "$(openssl rand -hex 32)" "$(openssl rand -base64 32)" >> /tmp/cmp.env
          for spec in \
            'compose.production.yml|' \
            'compose.production.yml|status' \
            'compose.production.yml|tesla' \
            'docker-compose.yml|' \
            'docker-compose.yml docker-compose.build.yml|' \
            'docker-compose.yml docker-compose.build.yml docker-compose.dev.yml|' \
            'compose.production.yml docker-compose.ci.yml|'; do
            files="${spec%%|*}"; profile="${spec#*|}"
            read -r -a file_list <<< "$files"
            args=(); for f in "${file_list[@]}"; do args+=(-f "$f"); done
            pflag=(); [ -n "$profile" ] && pflag=(--profile "$profile")
            docker compose --env-file /tmp/cmp.env "${args[@]}" "${pflag[@]}" config --format json > /tmp/config.json
            node scripts/compose-render.mjs --env-file /tmp/cmp.env "${file_list[@]}" "${pflag[@]}" > /tmp/render.json
            node scripts/compare-compose-config.mjs /tmp/render.json /tmp/config.json
          done
      - name: No-env defaults — config renders with an empty environment
        run: |
          set -e
          : > /tmp/empty.env
          # -F: fixed strings — GNU grep treats ':\?' as an optional colon and
          # would match every line, failing this step for the wrong reason.
          if grep -nF ':?' compose.production.yml; then
            echo "FAIL: a ':?' fail-fast interpolation remains" >&2; exit 1
          fi
          docker compose -f compose.production.yml --env-file /tmp/empty.env config -q
          docker compose -f compose.production.yml --env-file /tmp/empty.env config --format json > /tmp/noenv.json
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('/tmp/noenv.json','utf8'));const env=j.services.web.environment;const req=['JWT_SECRET','VL_MASTER_KEY','PUBLIC_URL','DATABASE_URL'];for(const k of req){const v=env[k];if(!v){console.error('FAIL: '+k+' empty or missing with no env file');process.exit(1);}console.log('ok: '+k+' rendered from defaults');}if(!env.DATABASE_URL.includes('0273562be8b07bd887cce80c59cc66e4')){console.error('FAIL: POSTGRES_PASSWORD default not applied');process.exit(1);}"
      - name: Project and volume names stay the same across every invocation
        run: |
          set -e
          for spec in \
            'compose.production.yml|' \
            'compose.production.yml|status' \
            'compose.production.yml|tesla' \
            'docker-compose.yml|' \
            'docker-compose.yml docker-compose.build.yml|' \
            'docker-compose.yml docker-compose.build.yml docker-compose.dev.yml|' \
            'compose.production.yml docker-compose.ci.yml|'; do
            files="${spec%%|*}"; profile="${spec#*|}"
            read -r -a file_list <<< "$files"
            args=(); for f in "${file_list[@]}"; do args+=(-f "$f"); done
            pflag=(); [ -n "$profile" ] && pflag=(--profile "$profile")
            docker compose --env-file ci/compose.env "${args[@]}" "${pflag[@]}" config --format json \
              | jq -r '"\(.name) \(.volumes|keys|join(","))"'
          done | sort -u > /tmp/names.txt
          test "$(wc -l < /tmp/names.txt)" = "1"
          grep -qx 'voltlink pgdata' /tmp/names.txt
          echo "ok: every invocation renders project voltlink + volume pgdata"
      - name: actionlint
        run: |
          set -e
          mkdir -p /tmp/actionlint-bin
          curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash -s -- latest /tmp/actionlint-bin
          /tmp/actionlint-bin/actionlint -color .github/workflows/*.yml
      - name: Structural gates (C0)
        run: |
          set -e
          npm run check:compose
          npm run check:docs
          npm run check:token-extraction
          npx vitest run --project scripts

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      # R2-26: run gitleaks directly over the full history with the repo
      # config; no action wrapper, no per-push shallow scan.
      - name: Gitleaks over the full history
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --log-opts=--all --config .gitleaks.toml

  publish:
    runs-on: ubuntu-latest
    needs: [image, secret-scan, compose-validate]
    # Tag runs build nothing (C5.8): the tag-release job re-labels main's
    # verified digest.
    if: github.event_name == 'push' && github.server_url == 'https://github.com' && github.ref_type != 'tag'
    permissions:
      contents: read
      packages: write
    outputs:
      # digest keeps the sha256: prefix (used in promote as @<digest>).
      digest: ${{ steps.push.outputs.digest }}
      # The image is pushed under the commit-SHA tag (metadata type=sha,
      # format=long renders as "sha-<full sha>").
      tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          # The full commit-SHA tag only: latest/vX.Y.Z are pointed at it by
          # promote AFTER verify-published boots the digest (I-V100).
          tags: |
            type=sha,format=long
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          provenance: true
          sbom: true

  verify-published:
    runs-on: ubuntu-latest
    needs: [publish]
    if: github.event_name == 'push' && github.server_url == 'https://github.com'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guide runner against the published digest (the GitHub Actions image proof)
        env:
          # I-V100: verify-published boots the exact digest, not the mutable
          # version tag. The runner exports it as VOLTLINK_IMAGE_DIGEST for
          # every block (printed) so the guide's blocks stay verbatim.
          VOLTLINK_IMAGE_DIGEST: '@${{ needs.publish.outputs.digest }}'
        run: |
          node scripts/install-doc-run.mjs --workdir published-smoke \
            --compose-src "$PWD/compose.production.yml" --env-example-src "$PWD/.env.example" \
            --image-digest "$VOLTLINK_IMAGE_DIGEST" \
            --skip env-lan,env-https,env-webauthn --until up
          cd published-smoke
          TOKEN=$(docker compose logs web 2>&1 | grep 'first-run setup token' | tail -1 | awk '{print $NF}')
          test -n "$TOKEN" || { echo 'no first-run token in web log'; exit 1; }
          SMOKE_SETUP_TOKEN="$TOKEN" node ../scripts/smoke.mjs
          docker compose down -v
      - name: The booted digest equals the publish output (I-V100)
        run: |
          echo "digest: ${{ needs.publish.outputs.digest }}"
      - name: Upload the digest artifact (tag runs reuse it — no rebuild)
        run: printf '%s' '${{ needs.publish.outputs.digest }}' > /tmp/image-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-digest
          path: /tmp/image-digest.txt
          retention-days: 14

  tag-release:
    # C5.8 (I-V100, R2-02, R10 step 5): a tag run BUILDS NOTHING. It finds
    # main's successful CI run for the tagged commit, reuses its verified
    # digest artifact, re-labels the version tag (no annotations), verifies an
    # anonymous pull, and creates the GitHub release.
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      actions: read
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Find main's successful CI run for the tagged commit
        run: |
          RUN_ID=$(curl -fsS -H "Authorization: Bearer ${{ github.token }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&branch=main&event=push&status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id // empty')
          test -n "$RUN_ID" || { echo "::error::no successful main CI run for ${{ github.sha }}"; exit 1; }
          echo "main run: $RUN_ID"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e
        with:
          name: image-digest
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: sha tag digest, package version and image label all agree
        run: |
          set -e
          DIGEST=$(cat image-digest.txt)
          SHA_TAG="ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          GOT=$(docker buildx imagetools inspect "$SHA_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ "$GOT" = "$DIGEST" ] || { echo "::error::sha tag digest $GOT != main's artifact digest $DIGEST"; exit 1; }
          VERSION="v$(node -p "require('./package.json').version")"
          [ "${GITHUB_REF_NAME}" = "$VERSION" ] || { echo "::error::tag ${GITHUB_REF_NAME} != package version $VERSION"; exit 1; }
          LABEL=$(docker buildx imagetools inspect "$SHA_TAG" --format '{{json .Image.Labels}}' | jq -r '."org.opencontainers.image.version" // empty')
          [ "$LABEL" = "${GITHUB_REF_NAME}" ] || { echo "::error::image version label '$LABEL' != tag ${GITHUB_REF_NAME}"; exit 1; }
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"
      - name: Point the version tag at the verified digest (copy the index unchanged)
        run: |
          REF="ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}"
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            EXISTING=$(docker buildx imagetools inspect "$REF" --format '{{json .Manifest.Digest}}' | tr -d '"')
            if [ "$EXISTING" = "$DIGEST" ]; then
              echo "tag already points at the same digest — idempotent, nothing to do"
            else
              echo "::error::version tag exists with a different digest ($EXISTING)"; exit 1
            fi
          else
            docker buildx imagetools create --tag "$REF" "ghcr.io/${{ github.repository }}@$DIGEST"
          fi
      - name: Log out, then the anonymous registry fetch matches the digest
        run: |
          docker logout ghcr.io || true
          # Anonymous manifest fetch (what a pull does) must see the tag.
          PULLED=$(docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ "$PULLED" = "$DIGEST" ] || { echo "::error::anonymous fetch digest $PULLED != $DIGEST"; exit 1; }
      - name: Create the GitHub release
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "VoltLink ${GITHUB_REF_NAME}" \
            --notes "Image: ghcr.io/${{ github.repository }}@$DIGEST" \
            --target "${{ github.sha }}"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Release window — the guide's release URL serves this checkout's compose file
        run: |
          # Push the tag right after main's green run so the docs' release URL
          # is broken for as short a window as possible; this post-tag check
          # proves the URL now serves exactly what this checkout shipped.
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${GITHUB_REF_NAME}/compose.production.yml" -o /tmp/release-compose.yml
          diff -q compose.production.yml /tmp/release-compose.yml
          echo "ok: https://raw.githubusercontent.com/${{ github.repository }}/${GITHUB_REF_NAME}/compose.production.yml serves the checkout file"

  upgrade-smoke:
    runs-on: ubuntu-latest
    needs: [image]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Boot v1.0.0's own compose file, create data, upgrade in place
        run: |
          set -e
          mkdir -p upgrade-smoke && cd upgrade-smoke
          # 1) v1.0.0's OWN compose file, from its own tag.
          git show v1.0.0:compose.production.yml > compose.production.yml
          # 2) .env written per v1.0.0's docs (the same .env survives the upgrade).
          umask 077
          {
            printf 'JWT_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'VL_MASTER_KEY=%s\n' "$(openssl rand -base64 32)"
            printf 'POSTGRES_PASSWORD=%s\n' "$(openssl rand -hex 16)"
            printf 'PUBLIC_URL=http://127.0.0.1:3110\n'
            printf 'VL_ALLOW_INSECURE_HTTP=true\n'
          } > .env
          BEFORE="$( (docker compose -p voltlink -f compose.production.yml exec -T postgres psql -U voltlink -d voltlink -tAc "SELECT count(*) FROM _prisma_migrations" 2>/dev/null) || true )"
          VOLTLINK_IMAGE_TAG=v1.0.0 docker compose -p voltlink -f compose.production.yml up -d --wait
          # 3) v1.0.0 cannot bootstrap through its API (no setup token is
          #    logged and the UI has no field for one — CHANGELOG 1.1.0);
          #    seed with its migrate role (already run at boot) + SQL fixtures.
          HASH=$(node -e "require('argon2').hash('upgrade-password-12345').then(console.log)")
          docker compose -p voltlink -f compose.production.yml exec -T postgres psql -U voltlink -d voltlink \
            -c "INSERT INTO \"User\" (id, email, name, \"passwordHash\", \"emailVerifiedAt\", \"isInstanceAdmin\") VALUES ('upgrade-seed-user', 'upgrade@example.invalid', 'Upgrade Seed', '$HASH', now(), true) ON CONFLICT DO NOTHING"
          # 4) data created in v1.0.0: the seeded sign-in works.
          SMOKE_EMAIL='upgrade@example.invalid' SMOKE_PASSWORD='upgrade-password-12345' node ../scripts/smoke.mjs
          # 5) replace the file with the new compose.production.yml, keep the
          #    same .env and project, add the CI overlay to COMPOSE_FILE.
          cp ../compose.production.yml compose.production.yml
          printf 'COMPOSE_FILE=compose.production.yml:../docker-compose.ci.yml\n' >> .env
          docker compose -p voltlink up -d --wait
          # 6) same voltlink_pgdata volume, new migration rows, data + sign-in survive.
          AFTER=$(docker compose -p voltlink exec -T postgres psql -U voltlink -d voltlink -tAc "SELECT count(*) FROM _prisma_migrations")
          test "$AFTER" -gt "${BEFORE:-0}"
          echo "migration rows: $BEFORE -> $AFTER"
          docker volume inspect voltlink_pgdata >/dev/null
          SMOKE_EMAIL='upgrade@example.invalid' SMOKE_PASSWORD='upgrade-password-12345' node ../scripts/smoke.mjs
          docker compose -p voltlink down -v

  promote:
    runs-on: ubuntu-latest
    needs: [publish, verify-published]
    # latest only from main; version tags are the tag-release job's business
    # (C5.8).
    if: github.event_name == 'push' && github.server_url == 'https://github.com' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Versions are never re-pointed: latest only from main (I-V100).
      - name: Point latest at the verified digest (main only)
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/atvriders/voltlink:latest" \
            "ghcr.io/atvriders/voltlink@${{ needs.publish.outputs.digest }}"
